name: Publish Language enablement index on /TR

on:
  workflow_dispatch:

jobs:
  publish-TR:
    name: Publish Language enablement index
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # index.html loads ../i18n-activity/templates/gap-analysis/prompts.js.
      # spec-prod serves the repo at localhost:3000, where ".." collapses to "/",
      # so the shared file must be reachable at /i18n-activity/… during the build.
      - uses: actions/checkout@v6
        with:
          repository: w3c/i18n-activity
          path: i18n-activity
          sparse-checkout: templates/gap-analysis
      - uses: w3c/spec-prod@v2
        with:
          TOOLCHAIN: respec
          SOURCE: index.html
          W3C_ECHIDNA_TOKEN: ${{ secrets.TR_TOKEN_TYPOGRAPHY }}
          W3C_WG_DECISION_URL: https://lists.w3.org/Archives/Public/www-international/2016AprJun/0046.html
          W3C_BUILD_OVERRIDE: |
            specStatus: DNOTE
            shortname: typography